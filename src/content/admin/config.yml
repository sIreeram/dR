backend:
  name: git-gateway
  branch: main # Change to master if your default branch is named master

media_folder: "static/images" # Where uploaded logos and images will be saved
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog" # Path to your markdown blog files
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Global Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "site_config"
        label: "Site Identity & Logo"
        file: "data/settings.json" # File where site data will save
        fields:
          - { label: "Site Title", name: "site_title", widget: "string" }
          - { label: "Site Logo", name: "site_logo", widget: "image" }
          - { label: "Description", name: "description", widget: "text" }
